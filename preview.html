<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<style>
  /* La misma noche de la portada, para que el enlace y la app sean una pieza. */
  :root{--azul:#4C79FF;--naranja:#FFA42B;--verde:#56C93A;--turquesa:#22C4D2;--magenta:#F0479F}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#0B1119;color:#fff;position:relative;overflow:hidden;
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .velo{position:absolute;inset:0;
        background:linear-gradient(180deg,rgba(8,14,22,.62) 0%,rgba(8,14,22,.40) 40%,rgba(8,14,22,.78) 100%)}
  .cenefa{position:absolute;left:0;right:0;height:26px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'72\' height=\'12\' viewBox=\'0 0 72 12\'><g fill=\'none\' stroke-width=\'2.4\' stroke-linecap=\'square\'><path d=\'M2 10V4h6v4h4V2h6\' stroke=\'%23FFA42B\'/><path d=\'M26 10V4h6v4h4V2h6\' stroke=\'%2322C4D2\'/><path d=\'M50 10V4h6v4h4V2h6\' stroke=\'%23F0479F\'/></g></svg>");
    background-repeat:repeat-x;background-size:156px 26px}
  .cenefa.arriba{top:0}.cenefa.abajo{bottom:0;transform:scaleY(-1)}
  .capa{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  .vidrio{position:relative;overflow:hidden;background:rgba(255,255,255,.07);
    backdrop-filter:blur(18px) saturate(140%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.24),0 18px 44px rgba(0,0,0,.4)}
  .vidrio::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
    background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 22%,
      rgba(255,255,255,0) 42%,rgba(255,255,255,0) 58%,rgba(255,255,255,.18) 78%,rgba(255,255,255,.55) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude}
  .logos{display:flex;align-items:center;gap:22px;padding:14px 26px;border-radius:24px;margin-bottom:22px}
  .logos img{height:74px;width:auto;object-fit:contain}
  h1{font-size:82px;line-height:1;font-weight:900;text-transform:uppercase;letter-spacing:-.005em}
  h1 span{background-image:linear-gradient(176deg,#fff 0%,#fff 32%,rgba(255,255,255,.72) 52%,rgba(255,255,255,.94) 74%,#fff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.6)) drop-shadow(0 3px 5px rgba(0,0,0,.45)) drop-shadow(0 14px 26px rgba(0,0,0,.5))}
  h1 .b2{background-image:linear-gradient(176deg,#FFE7C2 0%,#FFD79B 34%,rgba(255,164,43,.9) 54%,#FFCF8C 76%,#FFF0D8 100%);
    -webkit-background-clip:text;background-clip:text}
  .lema{margin-top:14px;color:rgba(255,255,255,.9);font-weight:900;font-size:17px;letter-spacing:.3em;
        text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .frase{margin-top:24px;max-width:820px;font-size:26px;line-height:1.35;color:rgba(255,255,255,.94);
         text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .frase b{font-weight:900}
  .chip{margin-top:26px;font-weight:900;font-size:19px;padding:14px 30px;border-radius:999px;
        text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .mq{position:absolute;right:46px;bottom:56px;height:66px;z-index:2}
</style></head><body>
<img class="foto" src="/fondo/ventana.jpg" alt="">
<span class="velo"></span>
<div class="cenefa arriba"></div>
<div class="capa">
  <div class="logos vidrio"><img src="/marcas/cadteba.png" alt="CADTEBA"><img src="/marcas/turismo.png" alt="Turismo somos todos"></div>
  <h1><span class="b1">Barinas</span> <span class="b2">opina</span></h1>
  <p class="lema">Turismo somos todos</p>
  <p class="frase">Se está armando un <b>nuevo modelo tributario</b> en el país. El comercio ya llevó sus números. El turismo de Barinas todavía no. Tu negocio tiene 3 minutos.</p>
  <div class="chip vidrio">CADTEBA · Estado Barinas</div>
</div>
<img class="mq" src="/marcas/masquellano.png" alt="Más que llano">
<div class="cenefa abajo"></div>
</body></html>
